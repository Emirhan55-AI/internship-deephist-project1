# Video Settings
video:
  input_source: "data/input/classroom_4.mp4"  # 0 for webcam, path for file, URL for stream
  output:
    enabled: true  # Enable video recording with tracking annotations
    path: "data/output/tracked_output.mp4"  # Output video path
    codec: "mp4v"  # Video codec (use XVID or MJPG if mp4v doesn't work)
    fps: null  # null to match input FPS

# Display Settings
display:
  enabled: false
  window_name: "Eyes on You - Student Tracking"
  fps_limit: 30
  resize:
    enabled: true
    width: 1280
    height: 720
    maintain_aspect_ratio: true

# YOLO Model Settings
model:
  path: "models/yolo11s.pt"
  device: "cpu"  # "cpu" or "cuda:0"
  confidence_threshold: 0.3
  iou_threshold: 0.3
  classes: [0]  # 0 for person class

# Tracking Settings (BoT-SORT)
tracking:
  algorithm: "botsort"  # "botsort" or "bytetrack"
  track_high_thresh: 0.4
  track_low_thresh: 0.1
  new_track_thresh: 0.4
  track_buffer: 200
  match_thresh: 0.3
  proximity_thresh: 0.5
  appearance_thresh: 0.35
  cmc_method: "ecc"  # "ecc" or "sparse"
  history_length: 50
  trajectory_length: 50
  reid_weights_path: "models/osnet_x0_25_msmt17.pt"

# Student Counting Settings
counter:
  confidence_threshold: 0.4
  max_confirmed_students: 1000

# Visualization Settings
visualization:
  show_confidence: true
  show_track_id: true
  show_trajectory: true
  box_thickness: 2
  font_scale: 0.6
  font_thickness: 2

# Performance Settings
performance:
  max_duration: null  # null for unlimited
  verbose: true
  frame_skip: 2  # Process every Nth frame (2 = skip 1 frame, 3 = skip 2 frames, etc.)

# Statistics Settings
statistics:
  show_progress: true
  show_final_stats: true
  progress_format: "Progress: {progress:.1f}% ({elapsed:.1f}s/{total:.1f}s) - FPS: {fps:.1f} - Students: {students}"
