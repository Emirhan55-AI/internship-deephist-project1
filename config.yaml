# Video Settings
video:
  input_source: "data/input/classroom_1.mp4"
  frame_rate: null 
  output:
    enabled: true
    path: "data/output/tracked_output.mp4"
    codec: "mp4v"
    fps: null

# Display Settings
display:
  enabled: true
  window_name: "Eyes on You - Student Tracking"
  fps_limit: 30
  resize:
    enabled: true
    width: 1280
    height: 720
    maintain_aspect_ratio: true

# YOLO Model Settings
model:
  path: "models/yolo11s.pt"
  device: "cuda:0"  
  confidence_threshold: 0.40  
  iou_threshold: 0.50 
  classes: [0] 

# BoT-SORT Tracking Settings
tracking:
  track_high_thresh: 0.467  
  track_low_thresh: 0.159   
  new_track_thresh: 0.716   
  track_buffer: 90          
  match_thresh: 0.85         
  proximity_thresh: 0.50     
  appearance_thresh: 0.55    
  cmc_method: "ecc"          
  reid_weights_path: "models/osnet_x0_25_msmt17.pt"

# Student Counting Settings
counter:
  confidence_threshold: 0.5
  max_confirmed_students: 1000

# Visualization Settings
visualization:
  show_confidence: true
  show_track_id: true
  show_trajectory: true
  box_thickness: 2
  font_scale: 0.6
  font_thickness: 2

# Performance Settings
performance:
  max_duration: null
  verbose: true
  frame_skip: 1

# Statistics Settings
statistics:
  show_progress: true
  show_final_stats: true
  progress_format: "Progress: {progress:.1f}% ({elapsed:.1f}s/{total:.1f}s) - FPS: {fps:.1f} - Students: {students}"